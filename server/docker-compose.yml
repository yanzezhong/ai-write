# AI 写作器云同步服务（go-zero + MongoDB）
# 用法：docker compose up -d --build
services:
  mongo:
    image: mongo:latest
    environment:
      TZ: Asia/Shanghai
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/01-index.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      AIWRITE_MONGO_URI: "mongodb://mongo:27017"
    ports:
      - "8787:8787"

volumes:
  mongo-data:
